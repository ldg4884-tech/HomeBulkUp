name: Build Home Bulk Up APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'HomeBulkUp_Project.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract full Android project from uploaded ZIP
        run: |
          unzip -o HomeBulkUp_Project.zip -d /tmp/homebulkup-source
          cp -a /tmp/homebulkup-source/HomeBulkUp/. .
          test -f app/src/main/java/kr/co/homebulkup/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: home-bulk-up-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
