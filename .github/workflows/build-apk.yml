          if s.count(old) != 1: raise SystemExit('WorkoutScreen day anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('program.forEachIndexed { i, d -> Column(', 'editableProgram.forEachIndexed { i, d -> Column(', 1)
