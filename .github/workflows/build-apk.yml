name: Build Home Bulk Up APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'HomeBulkUp_Project.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract full Android project from uploaded ZIP
        run: |
          unzip -o HomeBulkUp_Project.zip -d /tmp/homebulkup-source
          cp -a /tmp/homebulkup-source/HomeBulkUp/. .
          test -f app/src/main/java/kr/co/homebulkup/MainActivity.kt
      - name: Add easy-to-reach rest timer after every set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/kr/co/homebulkup/MainActivity.kt')
          lines = p.read_text().splitlines()
          target = next((i for i, line in enumerate(lines) if 'OutlinedTextField(value = setReps' in line), None)
          if target is None:
              raise SystemExit('Could not find set repetition field')
          insert_at = None
          for i in range(target + 1, len(lines) - 1):
              if lines[i].strip() == '}' and lines[i + 1].strip() == '}':
                  insert_at = i + 1
                  break
          if insert_at is None:
              raise SystemExit('Could not find end of set input row')
          button = [
              '                    OutlinedButton(onClick = timer, modifier = Modifier.fillMaxWidth().padding(top = 2.dp, bottom = 8.dp), colors = ButtonDefaults.outlinedButtonColors(contentColor = Lime)) {',
              '                        Icon(Icons.Default.Timer, null)',
              '                        Spacer(Modifier.width(8.dp))',
              '                        Text("$setNo 세트 휴식 타이머", fontWeight = FontWeight.Bold)',
              '                    }',
          ]
          lines[insert_at:insert_at] = button
          p.write_text('\n'.join(lines) + '\n')
          print('Added a full-width rest-timer button after each set input row.')
          PY
      - name: Debounce workout log persistence to reduce typing stutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/kr/co/homebulkup/MainActivity.kt')
          s = p.read_text()
          anchor = '    var logs by remember(dateKey) { mutableStateOf(loadExerciseLogs(prefs)) }'
          if s.count(anchor) != 1:
              raise SystemExit('Expected one workout log state declaration; refusing unsafe patch')
          effect = anchor + '\n    LaunchedEffect(logs, dateKey) {\n        delay(350)\n        saveExerciseLogs(prefs, logs)\n    }'
          s = s.replace(anchor, effect, 1)
          old = '                            saveExerciseLogs(prefs, logs)\n'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected two per-keystroke saves, found {count}; refusing unsafe patch')
          s = s.replace(old, '', 2)
          p.write_text(s)
          print('Workout log persistence is now debounced; input changes no longer serialize and save the entire log map on every keystroke.')
          PY
      - name: Reduce workout list composition cost
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/kr/co/homebulkup/MainActivity.kt')
          s = p.read_text()
          marker = '                    OutlinedButton(onClick = timer, modifier = Modifier.fillMaxWidth().padding(top = 2.dp, bottom = 8.dp), colors = ButtonDefaults.outlinedButtonColors(contentColor = Lime)) {'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Could not find per-set timer button')
          end = s.find('\n                    }', start)
          if end < 0:
              raise SystemExit('Could not find end of per-set timer button')
          end += len('\n                    }')
          s = s[:start] + s[end:]
          start = s.find('                val priorSet = ')
          if start < 0:
              raise SystemExit('Could not find prior-set lookup')
          end = s.find('\n                if (priorSet.any', start)
          if end < 0:
              raise SystemExit('Could not find end of prior-set lookup')
          block = '''                val priorSet = remember(logs, selected, idx, dateKey, exercise.sets) {
                    (0 until exercise.sets).map { setNo ->
                        val suffix = "-$selected-$idx-set-${setNo+1}-weight"
                        logs.entries.asSequence()
                            .filter { it.key.endsWith(suffix) && !it.key.startsWith(dateKey) }
                            .maxByOrNull { it.key.substringBefore(suffix) }?.value.orEmpty()
                    }
                }'''
          s = s[:start] + block + s[end:]
          p.write_text(s)
          print('Removed repeated per-set timer buttons and memoized previous-set lookup.')
          PY
      - name: Optimize workout list item reuse for smoother scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/kr/co/homebulkup/MainActivity.kt')
          s = p.read_text()
          old = 'itemsIndexed(day.exercises) { idx, exercise ->'
          new = 'itemsIndexed(day.exercises, key = { index, _ -> "${selected}-exercise-${index}" }, contentType = { _, _ -> "workout-exercise" }) { idx, exercise ->'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected one workout list declaration, found {count}; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Workout exercises now have stable item keys and a shared content type.')
          PY
      - name: Create modern HomeBulkUp launcher icon
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > app/src/main/res/drawable/ic_homebulkup_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#55E6BD" android:pathData="M69,27 L69,19 L91,19 L91,41 L83,41 L83,33 L69,47 L60,38 L49,49 L43,43 L60,26 L69,35 L77,27 Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M23,47 L28,47 L28,40 L35,40 L35,47 L42,47 L42,61 L35,61 L35,68 L28,68 L28,61 L23,61 Z"/>
              <path android:fillColor="#55E6BD" android:pathData="M42,51 L67,51 L67,57 L42,57 Z"/>
              <path android:fillColor="#55E6BD" android:pathData="M67,45 L74,45 L74,63 L67,63 Z"/>
              <path android:fillColor="#55E6BD" android:pathData="M77,41 L84,41 L84,67 L77,67 Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M18,44 L23,44 L23,64 L18,64 Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M35,43 L42,43 L42,65 L35,65 Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M12,48 L17,48 L17,60 L12,60 Z"/>
          </vector>
          EOF
          cat > app/src/main/res/values/ic_homebulkup_background.xml <<'EOF'
          <resources><color name="homebulkup_icon_background">#102344</color></resources>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/homebulkup_icon_background"/>
              <foreground android:drawable="@drawable/ic_homebulkup_foreground"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/homebulkup_icon_background"/>
              <foreground android:drawable="@drawable/ic_homebulkup_foreground"/>
          </adaptive-icon>
          EOF
      - name: Register launcher icon in Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s2 = s.replace('<application ', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" ', 1)
          if s2 == s and 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit('Could not register launcher icon in manifest')
          p.write_text(s2)
          print('Launcher icon registered in AndroidManifest.xml')
          PY
      - name: Analyze Compose scrolling and recomposition hotspots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/kr/co/homebulkup/MainActivity.kt')
          s = p.read_text()
          terms = ('verticalScroll', 'rememberScrollState', 'LazyColumn', 'Column(', 'mutableStateOf', 'LaunchedEffect', 'Timer')
          print('--- Compose performance audit ---')
          for i, line in enumerate(s.splitlines(), 1):
              if any(term in line for term in terms):
                  print(f'{i}: {line.strip()}')
          print('--- End audit ---')
          PY
      - name: Inspect workout list state and composition boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app/src/main/java/kr/co/homebulkup/MainActivity.kt').read_text().splitlines()
          for lo, hi in ((178, 238),):
              print(f'--- MainActivity.kt lines {lo+1}-{min(hi,len(lines))} ---')
              for i in range(lo, min(hi, len(lines))):
                  print(f'{i+1}: {lines[i]}')
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Measure scroll frame performance on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device
            sleep 45
            adb shell getprop sys.boot_completed
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p kr.co.homebulkup 1
            sleep 10
            adb shell dumpsys gfxinfo kr.co.homebulkup reset
            adb shell input swipe 540 1750 540 450 450
            adb shell input swipe 540 450 540 1750 450
            adb shell input swipe 540 1750 540 450 450
            adb shell input swipe 540 450 540 1750 450
            adb shell input swipe 540 1750 540 450 450
            adb shell input swipe 540 450 540 1750 450
            adb shell input swipe 540 1750 540 450 450
            adb shell input swipe 540 450 540 1750 450
            adb shell dumpsys gfxinfo kr.co.homebulkup > scroll-gfxinfo.txt
            grep -E 'Total frames rendered|Janky frames:|90th percentile:|95th percentile:|99th percentile:' scroll-gfxinfo.txt || true
            echo "--- RAW GFXINFO SAVED AS scroll-gfxinfo.txt ---"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: home-bulk-up-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
