              val recentFoodCount = (0 until foodLogs.length()).count { i -> recentDays.contains(foodLogs.optJSONObject(i)?.optString("date")) }
              val recentWeights = history.filter { recentDays.contains(it.first) }.sortedBy { it.first }
              val weightDelta = if (recentWeights.size >= 2) recentWeights.last().second - recentWeights.first().second else null
              val advice = when {
                  recentWorkoutDays == 0 -> "이번 주 운동 완료 기록이 없어요. 부담 없는 운동 1회부터 기록해 보세요."
                  recentWorkoutDays < 3 -> "이번 주 운동 기록은 " + recentWorkoutDays + "회예요. 회복을 고려해 다음 주에는 가능한 일정에 운동을 한 번 더 배치해 보세요."
                  recentFoodCount < 3 -> "운동은 잘 기록하고 있어요. 식단 기록이 적어 섭취량 분석은 아직 제한적이에요. 주요 식사부터 기록해 보세요."
                  weightDelta != null && weightDelta <= 0f -> "최근 체중 변화가 정체 또는 감소 상태예요. 먼저 식단 기록의 누락 여부와 주간 평균 체중을 확인해 보세요."
                  else -> "좋아요! 운동과 식단 기록을 이어가세요. 무게나 반복 횟수는 자세와 회복이 안정적일 때 조금씩 높여 보세요."
              }
              Column(Modifier.fillMaxWidth().background(Panel, RoundedCornerShape(20.dp)).padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("WEEKLY COACH", color = Lime, fontSize = 11.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp)
                  Text("이번 주 코칭 리포트", color = White, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      StatCard("운동 기록", recentWorkoutDays.toString() + "일", "최근 7일", Modifier.weight(1f))
                      StatCard("식단 기록", recentFoodCount.toString() + "건", "최근 7일", Modifier.weight(1f))
                  }
                  Text(if (weightDelta == null) "체중 변화: 최근 7일 기록이 더 쌓이면 분석할 수 있어요." else "최근 7일 체중 변화: " + (if (weightDelta >= 0) "+" else "") + String.format(Locale.getDefault(), "%.1f", weightDelta) + "kg", color = if (weightDelta != null && weightDelta > 0) Lime else Muted, fontSize = 12.sp)
                  Text(advice, color = White, fontSize = 13.sp)
                  Text("※ 저장된 기록을 바탕으로 만든 규칙 기반 안내이며, 기록이 부족하면 분석 정확도가 낮을 수 있어요.", color = Muted, fontSize = 10.sp)
              }
          }
          '''
          s = s[:pos] + coach + s[pos:]
          # Add a per-set rest shortcut by locating the reps field without relying on indentation.
          if 'Text("휴식", fontSize = 10.sp)' not in s:
              lines = s.splitlines()
              target = next((i for i, line in enumerate(lines) if 'OutlinedTextField(value = setReps, onValueChange = { value ->' in line), None)
              if target is None: raise SystemExit('Could not locate reps field for set shortcut')
              close = next((i for i in range(target + 1, min(target + 5, len(lines))) if lines[i].strip().endswith('))')), None)
              if close is None: raise SystemExit('Could not locate end of reps field')
              lines.insert(close + 1, '                        Button(onClick = timer, contentPadding = PaddingValues(horizontal = 8.dp, vertical = 8.dp), colors = ButtonDefaults.buttonColors(containerColor = Lime, contentColor = Ink)) { Icon(Icons.Default.Check, null, modifier = Modifier.size(15.dp)); Text("휴식", fontSize = 10.sp) }')
              s = '\n'.join(lines) + '\n'
          # The rest timer launched from a set shortcut starts immediately.
          old_timer = '{ showTimer = true; timerRemaining = timer; timerRunning = false }'
          new_timer = '{ showTimer = true; timerRemaining = timer; timerRunning = true }'
          if old_timer in s: s = s.replace(old_timer, new_timer, 1)
          p.write_text(s)
          print('Added per-set rest shortcut that opens and starts the rest timer, plus weekly coaching report.')
          PY

